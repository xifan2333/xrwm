[package]
name = "xrwm"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "A River 0.4 Wayland window manager inspired by river-classic with composable shell CLI configuration"

[dependencies]
bitflags = "2.4"
rustix = { version = "1.1", features = ["event"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
xkbcommon = { version = "0.7", features = ["wayland"] }

[build-dependencies]
wayland-scanner = "0.31"

[lints.rust]
# The entire crate is safe Rust; no `unsafe` is permitted anywhere.
unsafe_code = "deny"

[lints.clippy]
# Ban `unwrap()` outside of tests; use explicit error handling instead.
unwrap_used = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
