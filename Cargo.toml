[package]
name = "xrwm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A River 0.4 Wayland window manager inspired by river-classic with composable shell CLI configuration"

[dependencies]
bitflags = "2.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = "0.3"
wayland-client = "0.31"
xkbcommon = { version = "0.7", features = ["wayland"] }

[build-dependencies]
wayland-scanner = "0.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
